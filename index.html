<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Better Calendar</title>
  <meta name="description" content="Your Google Calendar with a photo behind every event.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='6' fill='%23ffffff' stroke='%2316181d' stroke-width='2'/%3E%3Crect x='3' y='5' width='26' height='8' rx='4' fill='%23ef5b4c'/%3E%3Ccircle cx='16' cy='21' r='4' fill='%2316181d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.googleapis.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // The saved theme and card style before the first paint, so a dark theme never
    // flashes white. Same keys, defaults and Auto rule as js/theme.js.
    (function () {
      var t = "light", im = false;
      try { t = JSON.parse(localStorage.getItem("bd:theme")) || t; } catch (e) {}
      try { im = JSON.parse(localStorage.getItem("bd:immersive")) === true; } catch (e) {}
      if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
      if (im) document.documentElement.dataset.cards = "immersive";
    })();
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="js/main.js"></script>
  <!-- The whole module graph at once, instead of one import level per round trip.
       Firebase too: store.js would only ask for it after every module has run.
       The version must match V in js/store.js (a unit test checks both lists). -->
  <link rel="modulepreload" href="js/util.js">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/google.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/views.js">
  <link rel="modulepreload" href="js/overlaps.js">
  <link rel="modulepreload" href="js/panel.js">
  <link rel="modulepreload" href="js/photos.js">
  <link rel="modulepreload" href="js/curated.js">
  <link rel="modulepreload" href="js/sample.js">
  <link rel="modulepreload" href="js/done.js">
  <link rel="modulepreload" href="js/gestures.js">
  <link rel="modulepreload" href="js/theme.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js">
  <script>
    // If a script failed to load, say so instead of leaving a blank page.
    setTimeout(function () {
      var t = document.getElementById("title");
      if (t && !t.textContent.trim() && !document.getElementById("loadFail")) {
        var d = document.createElement("div");
        d.id = "loadFail";
        d.className = "load-fail";
        d.innerHTML = 'The calendar didn\'t load. <button type="button" class="btn small" onclick="location.reload()">Reload</button>';
        document.body.appendChild(d);
      }
    }, 5000);
  </script>
</head>
<body>
  <header class="bar">
    <div class="bar-in">
      <h1 id="title" class="title" aria-live="polite"></h1>

      <div class="seg-row">
        <div class="seg" id="seg" data-view="week" role="group" aria-label="View">
          <span class="seg-ind" aria-hidden="true"></span>
          <button type="button" data-v="day" aria-pressed="false">Day</button>
          <button type="button" data-v="week" aria-pressed="false">Week</button>
          <button type="button" data-v="month" aria-pressed="false">Month</button>
        </div>
        <button type="button" class="icon-btn done-btn" id="doneBtn" aria-pressed="false" aria-label="Completed">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.2"/></svg>
          <span class="db-n" hidden></span>
        </button>
      </div>

      <div class="bar-r">
        <div class="step">
          <button type="button" class="icon-btn" id="prevBtn" aria-label="Previous">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>
          </button>
          <button type="button" class="step-today" id="todayBtn">Today</button>
          <button type="button" class="icon-btn" id="nextBtn" aria-label="Next">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>
          </button>
        </div>
        <button type="button" class="acct-btn" id="acctBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="acctPop"></button>
      </div>
    </div>
    <div class="progress" aria-hidden="true"></div>
  </header>

  <div id="banner" class="banner" hidden></div>
  <main id="stage" class="stage"></main>

  <div id="acctPop" class="pop" role="dialog" aria-label="Accounts and calendars" hidden></div>
  <div id="scrim" class="scrim" hidden></div>
  <aside id="panel" class="panel" role="dialog" aria-modal="false" hidden></aside>
  <div id="welcome" class="welcome" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>
    <div class="welcome"><div class="wc-text">
      <strong>Better Calendar</strong>
      <span>Your Google Calendar as a list of photo cards. It needs JavaScript to run.
        <a class="wc-link" href="privacy.html">Privacy</a></span>
    </div></div>
  </noscript>
</body>
</html>

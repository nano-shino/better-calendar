name: Bug
description: Something looks or behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. Screenshots help.
    validations:
      required: true
  - type: dropdown
    id: view
    attributes:
      label: Where
      multiple: true
      options: [Day view, Week view, Month view, Event panel / photo picker, Accounts menu, Sign-in, Other]
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari 18 / Windows, Chrome 131
  - type: textarea
    id: console
    attributes:
      label: Console errors (optional)
      render: text

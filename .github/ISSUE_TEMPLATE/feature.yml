name: Feature
description: A new capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What should it do
      description: The need, in a sentence or two, and how you'd use it.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we'll know it works (what you'd see on screen).
  - type: textarea
    id: notes
    attributes:
      label: Notes, references, mockups

# Deploy: cd worker && npx wrangler deploy   (see docs/SETUP.md)
name = "better-calendar-tokens"
main = "index.js"
compatibility_date = "2026-10-01"

# Public values. The two secrets are set with `npx wrangler secret put`:
#   GOOGLE_CLIENT_SECRET  from the same OAuth web client as googleClientId
#   TOKEN_KEY             32 random bytes, base64 (encrypts stored refresh tokens)
[vars]
GOOGLE_CLIENT_ID = "1030565348689-ccj4fbrm4bqdekbguq5ofm31ur8s04a0.apps.googleusercontent.com"
FIREBASE_PROJECT_ID = "better-calendar-dc33f"
FIREBASE_API_KEY = "AIzaSyA_nJLcW9S4apod2AwrRURx1On1XWNVBOI"
ALLOWED_ORIGINS = "https://nano-shino.github.io,http://localhost:8000"

# Create with: npx wrangler kv namespace create TOKENS, then paste the id here.
[[kv_namespaces]]
binding = "TOKENS"
id = "1ae1c70731ae4af78ac8cfc4f6efceea"
